  - Encoding=UTF-8
  - Name=Yutovo
  - Name[ru]=Ютово
  - Comment=Calculator
  - Comment[ru]=Калькулятор
  - GenericName=Calculator
  - GenericName[ru]=Калькулятор
  - Type=Application
  - Path=bin/
  - Exec=run.sh
  - Icon=/usr/share/icons/hicolor/256x256/apps/yutovo.png
  - StartupNotify=true
  - Terminal=false
  - Categories=Science;
  - MimeType=text/plain;
