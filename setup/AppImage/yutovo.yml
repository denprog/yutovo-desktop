  - mkdir -p usr/lib/qt5/plugins
  - cp -r /usr/lib/x86_64-linux-gnu/qt5/plugins/platforms usr/lib/qt5/plugins
  - mv opt/yutovo/* usr/bin/
  - cp ../../run.sh usr/bin/
